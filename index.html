<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c57">
<meta name="description" content="FlowDesk GRM: grievance redress and field data collection for resettlement and land acquisition projects. Works offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FlowDesk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>FlowDesk GRM</title>
<style>
:root{
  --bg:#f3f5f4;--surface:#fff;--surface-2:#f8faf9;--ink:#13201f;--ink-2:#46534f;--ink-3:#7a8784;
  --line:#e1e7e5;--line-2:#cbd5d2;
  --brand:#0f5c57;--brand-dark:#0a403c;--brand-soft:#e2f0ee;--brand-ink:#fff;
  --ok:#1d7a4b;--ok-soft:#e1f3e9;--warn:#9a5800;--warn-soft:#fcefd6;--bad:#b42318;--bad-soft:#fde7e5;
  --info:#24529f;--info-soft:#e5edfa;--vio:#6a3e9e;--vio-soft:#efe8f8;--mute:#5b6866;--mute-soft:#eceff0;
  --radius:10px;--radius-sm:7px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 12px 32px rgba(16,24,40,.18);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.92rem;font-weight:700}
.hidden{display:none!important}
.muted{color:var(--ink-3)}
.small{font-size:.8rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85em}
.row{display:flex;align-items:center;gap:.5rem}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.stack>*+*{margin-top:.75rem}
.grow{flex:1}
.nowrap{white-space:nowrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:40px;padding:.5rem 1rem;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-dark)}
.btn-danger{color:var(--bad);border-color:#f0b8b2}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:32px;padding:.3rem .65rem;font-size:.8rem}
.btn-lg{min-height:52px;font-size:1rem;width:100%}
.btn svg{width:18px;height:18px;flex:none}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Forms */
.field{display:block;margin-bottom:.85rem}
.field>span,.lbl{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:.3rem}
.req::after{content:" *";color:var(--bad)}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:.55rem .7rem;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);font-size:16px}
textarea.inp{min-height:96px;resize:vertical}
.inp:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.inp.invalid{border-color:var(--bad);background:var(--bad-soft)}
.check{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem .7rem;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;margin-bottom:.5rem}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--brand);flex:none}
.check b{display:block;font-size:.88rem}
.check small{color:var(--ink-3);font-size:.78rem}
.check.alert{border-color:#f0b8b2;background:var(--bad-soft)}
.opts{display:flex;flex-wrap:wrap;gap:.4rem}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-block;padding:.5rem .8rem;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);font-size:.85rem;cursor:pointer;user-select:none}
.opt input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.opt input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 .75rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 .75rem}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
fieldset{border:0;margin:0 0 1rem}
legend{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:.6rem}
.err-text{color:var(--bad);font-size:.8rem;margin-top:.25rem}

/* Cards, badges */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem}
.card+.card{margin-top:.85rem}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.75rem}
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .5rem;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap;background:var(--mute-soft);color:var(--mute)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.badge.plain::before{display:none}
.b-info{background:var(--info-soft);color:var(--info)}
.b-vio{background:var(--vio-soft);color:var(--vio)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-mute{background:var(--mute-soft);color:var(--mute)}
.b-brand{background:var(--brand-soft);color:var(--brand)}
.empty{padding:2rem 1rem;text-align:center;color:var(--ink-3);font-size:.9rem}

/* Auth */
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:1.25rem;background:linear-gradient(160deg,#0a403c 0%,#0f5c57 55%,#2b7a63 100%)}
.auth-box{width:100%;max-width:380px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);padding:1.75rem}
.brand{display:flex;align-items:center;gap:.6rem}
.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff;flex:none}
.brand-mark svg{width:22px;height:22px}
.brand b{font-size:1.05rem;letter-spacing:-.01em}
.brand small{display:block;font-size:.72rem;color:var(--ink-3);font-weight:500}
.auth-box .brand{margin-bottom:1.25rem}
.auth-note{font-size:.78rem;color:var(--ink-3);margin-top:1rem;text-align:center}
.alert-box{padding:.65rem .8rem;border-radius:var(--radius-sm);font-size:.84rem;margin-bottom:.85rem;background:var(--bad-soft);color:var(--bad)}
.alert-box.info{background:var(--info-soft);color:var(--info)}
.alert-box.warn{background:var(--warn-soft);color:var(--warn)}

/* App chrome */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;background:var(--surface);border-bottom:1px solid var(--line);min-height:56px}
.topbar .proj{min-width:0;flex:1}
.topbar select.inp{min-height:36px;padding:.3rem .5rem;font-size:.88rem;max-width:260px}
.proj-name{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-sub{font-size:.72rem;color:var(--ink-3)}
.sync-pill{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .7rem;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
.sync-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync-pill.off .dot{background:var(--ink-3)}
.sync-pill.pend .dot{background:#d98a00}
.sync-pill.fail .dot{background:var(--bad)}
.sync-pill.busy .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.offline-bar{background:#2e3a38;color:#fff;font-size:.78rem;text-align:center;padding:.3rem .5rem}

/* Field agent layout */
.agent-main{max-width:640px;margin:0 auto;padding:1rem .9rem calc(84px + var(--safe-b))}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0 .55rem;font-size:.7rem;font-weight:600;color:var(--ink-3);text-decoration:none}
.bottom-nav a.on{color:var(--brand)}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:.25rem 0 1rem}
.action{display:flex;flex-direction:column;gap:.5rem;padding:1rem;border-radius:var(--radius);background:var(--brand);color:#fff;text-decoration:none;min-height:116px;box-shadow:var(--shadow)}
.action.alt{background:#1e4f7a}
.action b{font-size:1rem}
.action small{opacity:.8;font-size:.78rem}
.action .icon{width:26px;height:26px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:1rem}
.stat-mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.55rem .6rem}
.stat-mini b{display:block;font-size:1.15rem}
.stat-mini span{font-size:.7rem;color:var(--ink-3);font-weight:600}
.rec{display:flex;align-items:center;gap:.75rem;padding:.75rem .1rem;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer}
.rec:last-child{border-bottom:0}
.rec-main{flex:1;min-width:0}
.rec-title{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-sub{font-size:.76rem;color:var(--ink-3)}
.rec-err{font-size:.74rem;color:var(--bad)}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin-bottom:.85rem;overflow-x:auto}
.tabs button{border:0;background:none;padding:.55rem .8rem;font-weight:600;font-size:.86rem;color:var(--ink-3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.form-actions{position:sticky;bottom:calc(64px + var(--safe-b));display:flex;gap:.6rem;padding:.75rem 0;background:linear-gradient(transparent,var(--bg) 30%)}
.form-actions .btn{flex:1;min-height:48px}
.gps-box{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;border:1px dashed var(--line-2);border-radius:var(--radius-sm);background:var(--surface-2);font-size:.84rem}
.photos{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.photo{position:relative;width:76px;height:76px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;cursor:pointer}

/* HQ layout */
.hq{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{background:#0c2e2c;color:#cfe2df;padding:1rem .65rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.15rem}
.side .brand{color:#fff;padding:0 .4rem .9rem}
.side .brand small{color:#8fb2ad}
.side .brand-mark{background:#1a8077}
.side a{display:flex;align-items:center;gap:.6rem;padding:.55rem .65rem;border-radius:var(--radius-sm);color:#cfe2df;text-decoration:none;font-size:.88rem;font-weight:600}
.side a:hover{background:rgba(255,255,255,.06)}
.side a.on{background:#17504c;color:#fff}
.side .who{margin-top:auto;padding:.75rem .5rem 0;border-top:1px solid rgba(255,255,255,.1);font-size:.8rem}
.side .who b{display:block;color:#fff}
.side .who button{margin-top:.5rem;background:transparent;border:1px solid rgba(255,255,255,.25);color:#cfe2df;border-radius:6px;padding:.3rem .6rem;font-size:.76rem;cursor:pointer}
.hq-body{min-width:0;display:flex;flex-direction:column}
.hq-main{padding:1.25rem;max-width:1280px;width:100%}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.page-h p{color:var(--ink-3);font-size:.85rem}
.mob-nav{display:none}
@media (max-width:900px){
  .hq{grid-template-columns:1fr}
  .side{display:none}
  .mob-nav{display:flex;gap:.25rem;overflow-x:auto;background:#0c2e2c;padding:.4rem .5rem}
  .mob-nav a{color:#cfe2df;text-decoration:none;font-size:.8rem;font-weight:600;padding:.4rem .7rem;border-radius:6px;white-space:nowrap}
  .mob-nav a.on{background:#17504c;color:#fff}
  .hq-main{padding:1rem .8rem}
}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:.75rem;margin-bottom:1rem}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.85rem .9rem;box-shadow:var(--shadow);text-decoration:none;color:inherit}
.kpi span{display:block;font-size:.74rem;font-weight:600;color:var(--ink-3)}
.kpi b{display:block;font-size:1.65rem;line-height:1.15;margin-top:.2rem;font-variant-numeric:tabular-nums}
.kpi small{font-size:.74rem;color:var(--ink-3)}
.kpi.alert b{color:var(--bad)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.cols-detail{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:.85rem;align-items:start}
@media (max-width:900px){.cols2,.cols-detail{grid-template-columns:1fr}}
.cols2>.card+.card,.cols-detail .card+.card{margin-top:0}
.cols-detail>div>.card+.card{margin-top:.85rem}
.bars{display:flex;flex-direction:column;gap:.5rem}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr 36px;align-items:center;gap:.6rem;font-size:.82rem}
.bar-row .track{height:10px;background:var(--mute-soft);border-radius:5px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--brand);border-radius:5px}
.bar-row b{text-align:right;font-variant-numeric:tabular-nums}

/* Table */
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:.5rem;margin-bottom:.5rem}
.filters2{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:.5rem;align-items:center;margin-bottom:.85rem}
.filters .inp,.filters2 .inp{min-height:38px;font-size:.86rem}
@media (max-width:900px){.filters,.filters2{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
.t th{text-align:left;font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);padding:.6rem .7rem;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t th[data-sort]{cursor:pointer;user-select:none}
.t th[data-sort]:hover{color:var(--ink)}
.t th .arr{opacity:.6}
.t td{padding:.6rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
.t tbody tr{cursor:pointer}
.t tbody tr:hover{background:var(--surface-2)}
.t tbody tr:last-child td{border-bottom:0}
.t .ref{font-weight:700;white-space:nowrap}
.restricted{display:inline-flex;align-items:center;gap:.3rem;color:var(--vio);font-weight:600;font-size:.8rem}

/* Case detail */
.dl{display:grid;grid-template-columns:150px 1fr;gap:.45rem .8rem;font-size:.86rem}
.dl dt{color:var(--ink-3);font-weight:600}
.dl dd{min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.dl{grid-template-columns:1fr}.dl dt{margin-top:.3rem}}
.stepper{display:flex;gap:0;margin:.25rem 0 .9rem;overflow-x:auto}
.step{flex:1;min-width:92px;text-align:center;font-size:.72rem;font-weight:600;color:var(--ink-3);position:relative;padding-top:20px}
.step::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);z-index:1}
.step::after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line-2)}
.step:first-child::after{display:none}
.step.done{color:var(--ink-2)}
.step.done::before{background:var(--brand);border-color:var(--brand)}
.step.done::after,.step.cur::after{background:var(--brand)}
.step.cur{color:var(--brand)}
.step.cur::before{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.step.branch::before{border-color:var(--bad);background:var(--bad)}
.step.branch{color:var(--bad)}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:560px){.tl{grid-template-columns:1fr}}
.tl-item{border:1px solid var(--line);border-radius:var(--radius-sm);padding:.6rem .7rem;background:var(--surface-2)}
.tl-item span{display:block;font-size:.72rem;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.tl-item b{display:block;font-size:.92rem;margin:.15rem 0}
.tl-item.met{border-color:#b7e0c9;background:var(--ok-soft)}
.tl-item.late,.tl-item.overdue{border-color:#f0b8b2;background:var(--bad-soft)}
.tl-item.soon{border-color:#f2d39a;background:var(--warn-soft)}
.log{list-style:none}
.log li{padding:.6rem 0;border-bottom:1px solid var(--line);font-size:.86rem}
.log li:last-child{border-bottom:0}
.log .meta{font-size:.74rem;color:var(--ink-3);margin-bottom:.15rem}
.lock{display:flex;gap:.75rem;align-items:flex-start;padding:1rem;border-radius:var(--radius);background:var(--vio-soft);color:#3f2563;border:1px solid #d9c9ee}
.lock .icon{width:26px;height:26px;color:var(--vio)}

/* Feed */
.feed-item{display:flex;gap:.75rem;padding:.8rem 1rem;border-bottom:1px solid var(--line);cursor:pointer}
.feed-item:last-child{border-bottom:0}
.feed-item.new{background:#f2faf8}
.feed-avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.4rem .8rem;margin-top:.6rem;font-size:.8rem}
.kv div span{display:block;color:var(--ink-3);font-size:.72rem;font-weight:600}

/* Modal + toast */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(10,20,19,.45);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:640px){.modal-bg{align-items:center;padding:1rem}}
.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;box-shadow:var(--shadow-lg);padding:1.25rem 1.25rem calc(1.25rem + var(--safe-b))}
@media (min-width:640px){.modal{border-radius:14px}}
.modal h2{margin-bottom:.85rem}
.modal .actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(10px);z-index:60;background:#13201f;color:#fff;padding:.6rem 1rem;border-radius:8px;font-size:.85rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.splash{min-height:100%;display:grid;place-items:center;color:var(--ink-3);font-size:.9rem}

/* Reports + print */
.report{background:#fff;color:#111;border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;margin-top:1rem}
.report h1{font-size:1.3rem;margin-bottom:.2rem}
.report h2{font-size:1rem;margin:1.25rem 0 .5rem;padding-bottom:.3rem;border-bottom:2px solid var(--brand);color:var(--brand-dark)}
.report .rmeta{font-size:.8rem;color:#555;margin-bottom:.75rem}
.report table{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:.5rem;page-break-inside:auto}
.report th,.report td{border:1px solid #d5dbd9;padding:.35rem .5rem;text-align:left}
.report th{background:#eef3f2;font-weight:700}
.report td.n,.report th.n{text-align:right;font-variant-numeric:tabular-nums}
.report td:first-child{white-space:nowrap}

<script>
'use strict';
/* =====================================================================
   CONFIGURATION  (edit here, nothing below needs to change per deploy)
   ===================================================================== */

/** Backend REST API base URL. All endpoints are relative to this. */
const API_BASE = 'https://flowdesk-api-production-2cff.up.railway.app/api';

const APP_VERSION = '2.0.0';

/** GRM service standards. Projects may override ackDays / resolveDays. */
const GRM_CONFIG = {
  ackDays: 7,              // acknowledge within N days of receipt
  resolveDays: 30,         // resolve within N days of receipt (default target date)
  dueSoonDays: 3,          // highlight targets falling due within N days
  autoSyncSeconds: 60,     // background sync interval while queue is non-empty
  feedPollSeconds: 30,     // HQ field-data feed refresh interval
  maxPhotos: 4,            // photo attachments per record
  photoMaxPx: 1280,        // longest edge after on-device compression
  photoQuality: 0.72
};

const GRM_CHANNELS = [
  ['in_person', 'In person'], ['phone', 'Phone'], ['suggestion_box', 'Suggestion box'],
  ['email', 'Email'], ['other', 'Other']
];
const GRM_CATEGORIES = [
  ['land_compensation', 'Land / compensation'], ['employment', 'Employment'],
  ['environmental', 'Environmental'], ['community_safety', 'Community safety'],
  ['staff_conduct', 'Conduct of staff or contractors'],
  ['information_request', 'Information request'], ['other', 'Other']
];
const SEVERITIES = [['low', 'Low'], ['medium', 'Medium'], ['high', 'High']];

/**
 * Household survey definition. Add, remove or reorder fields here.
 * type: text | tel | number | select | multi | yesno | textarea
 * tally: true  -> counted per option in the field-data summary report
 * sum:   true  -> summed in the field-data summary report

const SURVEY_FORM = {

    { key: 'vulnerability', label: 'Vulnerability flags', type: 'multi', options: ['Female-headed', 'Elderly-headed', 'Child-headed', 'Person with disability', 'Chronic illness', 'Extremely poor', 'None'], tally: true },
    { key: 'consent_contact', label: 'Consents to be contacted', type: 'yesno', required: true, tally: true },
    { key: 'remarks', label: 'Enumerator remarks', type: 'textarea' }
  ]
};

/* =====================================================================
   CONSTANTS + STATE
   ===================================================================== */
const STATUSES = [
  ['received', 'Received'], ['acknowledged', 'Acknowledged'],
  ['under_investigation', 'Under investigation'], ['resolved', 'Resolved'],
  ['appealed', 'Appealed'], ['closed', 'Closed']
];
/** Allowed lifecycle transitions. Anything not listed is rejected. */
const TRANSITIONS = {
  received: ['acknowledged'],
  acknowledged: ['under_investigation'],
  under_investigation: ['resolved'],
  resolved: ['closed', 'appealed'],
  appealed: ['under_investigation'],
  closed: []
};
const OPEN_STATUSES = ['received', 'acknowledged', 'under_investigation', 'appealed'];
const STATUS_TONE = { received: 'b-info', acknowledged: 'b-vio', under_investigation: 'b-warn', resolved: 'b-ok', appealed: 'b-bad', closed: 'b-mute' };
const SYNC_LABEL = { draft: 'Draft', queued: 'Queued', synced: 'Synced', failed: 'Failed' };
const SYNC_TONE = { draft: 'b-mute', queued: 'b-warn', synced: 'b-ok', failed: 'b-bad' };
const AGENT_ROLES = ['field_agent', 'agent', 'field', 'enumerator', 'field_officer'];
const DB_NAME = 'flowdesk-grm';
const DB_VERSION = 1;

const state = {
  session: null,          // { token, user: {id,name,email,role,projects,canViewSensitive}, role: 'agent'|'supervisor' }
  projects: [],
  projectId: '',          // '' = all projects (supervisor only)
  grievances: [],
  submissions: [],
  invites: [],
  online: navigator.onLine,
  syncing: false,
  lastSync: null,
  feedSeenAt: null,
  ui: {}                  // transient per-view state (filters, tabs, sort)
};
const VIEWS = {};          // route name -> { render(params), mount?(params), static? }
const ACTIONS = {};        // data-act="name"    -> click handler (el, event)
const FORMS = {};          // data-form="name"   -> submit handler (form, submitter)
const CHANGES = {};        // data-change="name" -> change handler (el, event)
const timers = { sync: null, feed: null, toast: null };
let db = null;

/* =====================================================================
   UTILITIES
   ===================================================================== */
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ESC_MAP[c]); }
function uid() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayStr() { return ymd(new Date()); }
function parseYmd(s) { const p = String(s || '').slice(0, 10).split('-').map(Number); return new Date(p[0] || 1970, (p[1] || 1) - 1, p[2] || 1); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + Number(n || 0)); return ymd(d); }
function diffDays(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function fmtDate(s) { if (!s) return '-'; return parseYmd(s).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }
function fmtDateTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function timeAgo(iso) {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return Math.floor(s / 86400) + ' d ago';
}
function lbl(list, key) { const f = list.find(x => x[0] === key); return f ? f[1] : (key || '-'); }
function optionsHtml(list, selected, placeholder) {
  let out = placeholder !== undefined ? '<option value="">' + esc(placeholder) + '</option>' : '';
  for (const [v, t] of list) out += '<option value="' + esc(v) + '"' + (String(selected) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>';
  return out;
}
function initials(name) { return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?'; }
function countBy(list, fn) { const m = {}; for (const x of list) { const k = fn(x); if (k == null || k === '') continue; m[k] = (m[k] || 0) + 1; } return m; }
function pickList(data, keys) {
  if (Array.isArray(data)) return data;
  if (data && typeof data === 'object') for (const k of keys) if (Array.isArray(data[k])) return data[k];
  return [];
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(timers.toast);
  timers.toast = setTimeout(() => el.classList.remove('show'), 2800);
}
const ICONS = {
  logo: '<path d="M4 5h16v10H9l-5 4z"/><path d="M8.5 10l2 2 4-4"/>',
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  alert: '<path d="M4 5h16v10H9l-5 4z"/><path d="M12 8v3M12 13.5v.01"/>',
  clipboard: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
  list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  inbox: '<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/>',
  folder: '<path d="M3 7h6l2 2h10v10H3z"/>',
  report: '<path d="M6 3h9l4 4v14H6z"/><path d="M9 13v4M12 10v7M15 15v2"/>',
  users: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M16 11a3 3 0 0 0 0-6M21 20c0-2-1.5-4-4-4.7"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  print: '<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>'
};
function icon(name, cls) { return '<svg class="icon ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>'; }

/* =====================================================================
   INDEXEDDB (local-first store)
   ===================================================================== */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      if (!d.objectStoreNames.contains('grievances')) d.createObjectStore('grievances', { keyPath: 'lid' });
      if (!d.objectStoreNames.contains('submissions')) d.createObjectStore('submissions', { keyPath: 'lid' });
      if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idb(store, mode, fn) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    let result;
    if (req) req.onsuccess = () => { result = req.result; };
    tx.oncomplete = () => resolve(result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}
function dbGetAll(store) { return idb(store, 'readonly', os => os.getAll()); }
function dbGet(store, key) { return idb(store, 'readonly', os => os.get(key)); }
function dbPut(store, value, key) { return idb(store, 'readwrite', os => (key === undefined ? os.put(value) : os.put(value, key))); }
function dbDel(store, key) { return idb(store, 'readwrite', os => os.delete(key)); }
function dbClear(store) { return idb(store, 'readwrite', os => os.clear()); }

/* =====================================================================
   API CLIENT
   Contract (JSON over HTTPS, `Authorization: Bearer <token>` on every call):
     POST  /auth/login          {email,password} -> {token, user:{id,name,role,projects[],permissions[]}}
     GET   /projects            -> [project]        POST /projects {name,code,ackDays,resolveDays,description}
     GET   /grievances          ?createdBy=<userId> (field agents) -> [grievance] or {items:[...]}
     POST  /grievances          grievance + clientId (idempotency key) + provisionalRef -> grievance with id, ref
     GET   /grievances/:id      PATCH /grievances/:id  full record + updatedAt (server applies last-write-wins)
     GET   /submissions         ?agentId=<userId>   POST /submissions  submission + clientId -> submission with id
     POST  /invites             {email, role: field_agent|supervisor, projectIds[]}
   The server should redact sensitive cases (grievant, description, location,
   notes, photos, plus `redacted:true`) for users who are not the assigned
   handler and lack the `sensitive` permission.
   ===================================================================== */
async function api(method, path, body) {
  if (!navigator.onLine) { const e = new Error('Offline'); e.network = true; throw e; }
  const headers = { Accept: 'application/json' };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (state.session && state.session.token) headers.Authorization = 'Bearer ' + state.session.token;
  let res;
  try {
    res = await fetch(API_BASE + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  } catch (_) {
    const e = new Error('Network unavailable'); e.network = true; throw e;
  }
  const text = await res.text();
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch (_) { data = { message: text.slice(0, 200) }; } }
  if (!res.ok) {
    const e = new Error((data && (data.error || data.message)) || ('Request failed (' + res.status + ')'));
    e.status = res.status;
    if (res.status === 401 && path !== '/auth/login') handleExpiredSession();
    throw e;
  }
  return data;
}

/* =====================================================================
   SESSION + AUTH
   ===================================================================== */
function mapRole(role) { return AGENT_ROLES.includes(String(role || '').toLowerCase()) ? 'agent' : 'supervisor'; }
function normalizeUser(u) {
  u = u || {};
  const projects = u.projects || u.projectIds || u.projectAccess || u.project_access || [];
  const perms = u.permissions || [];
  return {
    id: String(u.id != null ? u.id : (u.userId || '')),
    name: u.name || u.fullName || u.full_name || u.email || 'User',
    email: u.email || '',
    role: u.role || '',
    projects: (Array.isArray(projects) ? projects : []).map(p => String(typeof p === 'object' ? p.id : p)),
    canViewSensitive: !!(u.canViewSensitive || u.confidentialHandler || (Array.isArray(perms) && (perms.includes('sensitive') || perms.includes('confidential'))))
  };
}
function me() { return state.session ? state.session.user : null; }
function isAgent() { return !!state.session && state.session.role === 'agent'; }

async function login(email, password) {
  const data = await api('POST', '/auth/login', { email, password });
  const token = data && (data.token || data.accessToken || data.access_token);
  if (!token) throw new Error('The server did not return a session token.');
  const user = normalizeUser(data.user);
  const owner = await dbGet('meta', 'owner');
  if (owner && owner.id !== user.id) {
    const pending = await countPendingStored();
    if (pending > 0) throw new Error('This device holds ' + pending + ' unsynced record(s) from ' + owner.name + '. Sign in as ' + owner.name + ' to sync them first.');
    await wipeLocalData();
  }
  state.session = { token, user, role: mapRole(user.role) };
  await dbPut('meta', state.session, 'session');
  await dbPut('meta', { id: user.id, name: user.name }, 'owner');
  await loadLocal();
  startApp();
  syncNow(false);
}
async function countPendingStored() {
  const [g, s] = await Promise.all([dbGetAll('grievances'), dbGetAll('submissions')]);
  return g.concat(s).filter(r => r.sync !== 'synced').length;
}
async function wipeLocalData() {
  await Promise.all(['grievances', 'submissions', 'projects'].map(dbClear));
  for (const k of ['projectId', 'lastSync', 'invites', 'feedSeenAt']) await dbDel('meta', k);
  state.grievances = []; state.submissions = []; state.projects = []; state.invites = [];
}
function pendingCount() { return state.grievances.concat(state.submissions).filter(r => r.sync === 'queued' || r.sync === 'failed').length; }
async function logout(force) {
  const unsynced = state.grievances.concat(state.submissions).filter(r => r.sync !== 'synced').length;
  if (unsynced && !force) {
    openModal('<h2>Unsynced records on this device</h2><p>' + unsynced + ' record(s) have not reached the server yet. They stay safely on this device and will sync the next time you sign in.</p>' +
      '<div class="actions"><button class="btn" data-act="modal-close">Cancel</button><button class="btn" data-act="sync-now">Sync now</button><button class="btn btn-primary" data-act="logout-force">Sign out</button></div>');
    return;
  }
  closeModal();
  state.session = null;
  await dbDel('meta', 'session');
  stopTimers();
  location.hash = '';
  renderLogin();
}
let expiredShown = false;
function handleExpiredSession() {
  if (expiredShown || !state.session) return;
  expiredShown = true;
  openModal('<h2>Session expired</h2><p>Your sign-in has expired. Your records are kept on this device. Sign in again to continue syncing.</p><div class="actions"><button class="btn btn-primary" data-act="logout-force">Sign in again</button></div>');
}

function renderLogin(message) {
  stopTimers();
  document.getElementById('app').innerHTML =
    '<div class="auth"><form class="auth-box" data-form="login" novalidate>' +
    '<div class="brand"><div class="brand-mark">' + icon('logo') + '</div><div><b>FlowDesk GRM</b><small>Grievance redress and field data</small></div></div>' +
    (message ? '<div class="alert-box">' + esc(message) + '</div>' : '') +
    (!navigator.onLine ? '<div class="alert-box warn">You are offline. Sign in once with a connection; after that the app works offline.</div>' : '') +
    '<label class="field"><span>Email</span><input class="inp" name="email" type="email" autocomplete="username" required></label>' +
    '<label class="field"><span>Password</span><input class="inp" name="password" type="password" autocomplete="current-password" required></label>' +
    '<div id="login-err"></div>' +
    '<button class="btn btn-primary btn-lg" type="submit">Sign in</button>' +
    '<p class="auth-note">Your role and project access come from your organisation account.</p>' +
    '</form></div>';
}

/* =====================================================================
   RECORD STORE + SYNC ENGINE
   Per-record sync state: draft | queued | synced | failed.
   Records are keyed locally by `lid` (client-generated). The API owns `id`;
   `clientId` (= lid) is sent with every create so retries are idempotent.
   Conflicts resolve last-write-wins on `updatedAt`. Nothing queued is ever
   removed locally until the server has accepted it.
   ===================================================================== */
const LOCAL_ONLY_FIELDS = ['lid', 'sync', 'syncError', 'refProvisional', 'redacted'];
function nowIso() { return new Date().toISOString(); }

async function saveLocal(kind, rec, touch) {
  if (touch !== false) rec.updatedAt = nowIso();
  const list = state[kind];
  const i = list.findIndex(r => r.lid === rec.lid);
  if (i >= 0) list[i] = rec; else list.unshift(rec);
  await dbPut(kind, rec);
  return rec;
}
async function queueLocal(kind, rec) {
  rec.sync = 'queued';
  rec.syncError = '';
  await saveLocal(kind, rec);
  renderSyncPill();
  syncSoon();
  return rec;
}
async function deleteDraft(kind, lid) {
  const rec = state[kind].find(r => r.lid === lid);
  if (!rec || rec.sync !== 'draft') return;
  state[kind] = state[kind].filter(r => r.lid !== lid);
  await dbDel(kind, lid);
}
function syncSoon() { clearTimeout(timers.soon); timers.soon = setTimeout(() => syncNow(false), 400); }
function syncTick() { if (navigator.onLine && pendingCount() > 0) syncNow(false); }

function toApi(kind, rec) {
  const out = {};
  for (const k of Object.keys(rec)) if (!LOCAL_ONLY_FIELDS.includes(k) && k !== 'id') out[k] = rec[k];
  out.clientId = rec.clientId || rec.lid;
  if (kind === 'grievances' && rec.refProvisional) { out.provisionalRef = rec.ref; delete out.ref; }
  if (rec.redacted) { delete out.grievant; delete out.description; delete out.location; delete out.photos; delete out.notes; }
  return out;
}
function normalizeProject(p) {
  return {
    id: String(p.id), code: p.code || p.projectCode || '', name: p.name || 'Untitled project',
    description: p.description || '',
    ackDays: Number(p.ackDays || p.ack_days) || '', resolveDays: Number(p.resolveDays || p.resolve_days) || '',
    updatedAt: p.updatedAt || p.updated_at || ''
  };
}
function normalizeGrievance(s, lid) {
  const g = Object.assign({ notes: [], history: [], photos: [], location: {}, grievant: null }, s);
  g.id = String(s.id);
  g.lid = lid || s.clientId || ('srv-' + s.id);
  g.ref = s.ref || s.reference || s.caseRef || '';
  g.refProvisional = false;
  g.projectId = String(s.projectId != null ? s.projectId : (s.project_id || ''));
  g.status = s.status || 'received';
  g.receivedAt = String(s.receivedAt || s.dateReceived || s.createdAt || nowIso()).slice(0, 10);
  g.updatedAt = s.updatedAt || s.updated_at || s.createdAt || nowIso();
  g.location = s.location || {};
  g.redacted = !!s.redacted;
  g.sync = 'synced';
  g.syncError = '';
  return g;
}
function normalizeSubmission(s, lid) {
  const n = Object.assign({ data: {}, photos: [], gps: null }, s);
  n.id = String(s.id);
  n.lid = lid || s.clientId || ('srv-' + s.id);
  n.projectId = String(s.projectId != null ? s.projectId : (s.project_id || ''));
  n.capturedAt = s.capturedAt || s.submittedAt || s.createdAt || nowIso();
  n.updatedAt = s.updatedAt || s.receivedAt || n.capturedAt;
  n.agent = s.agent || { id: String(s.agentId || s.submitted_by || ''), name: s.agentName || s.agent_name || 'Unknown agent' };
  n.sync = 'synced';
  n.syncError = '';
  return n;
}
/** Field devices never keep sensitive grievant details once the server has them. */
function applyAgentRedaction(kind, rec) {
  if (kind !== 'grievances' || !isAgent() || !rec.sensitive || rec.sync !== 'synced') return rec;
  rec.grievant = null; rec.description = ''; rec.location = { text: '' }; rec.photos = []; rec.notes = []; rec.redacted = true;
  return rec;
}

/** Push one record. Returns true when the server copy was newer (conflict resolved in its favour). */
async function pushRecord(kind, rec) {
  const base = kind === 'grievances' ? '/grievances' : '/submissions';
  const sentAt = rec.updatedAt;
  let res = null;
  if (rec.id && kind === 'grievances') res = await api('PATCH', base + '/' + encodeURIComponent(rec.id), toApi(kind, rec));
  else if (!rec.id) res = await api('POST', base, toApi(kind, rec));
  const current = state[kind].find(r => r.lid === rec.lid) || rec;
  const srv = res && (res.item || res.data || res.grievance || res.submission || res);
  if (!srv || srv.id == null) {
    current.sync = 'synced'; current.syncError = '';
    applyAgentRedaction(kind, current);
    await dbPut(kind, current);
    return false;
  }
  const n = kind === 'grievances' ? normalizeGrievance(srv, rec.lid) : normalizeSubmission(srv, rec.lid);
  if (current.updatedAt !== sentAt) {
    // Edited again while the request was in flight: adopt the server id/ref, stay queued.
    current.id = n.id;
    if (kind === 'grievances' && n.ref) { current.ref = n.ref; current.refProvisional = false; }
    await dbPut(kind, current);
    return false;
  }
  if ((!n.photos || !n.photos.length) && current.photos && current.photos.length && !n.redacted) n.photos = current.photos;
  if (kind === 'grievances' && !n.ref) { n.ref = current.ref; n.refProvisional = !!current.refProvisional; }
  applyAgentRedaction(kind, n);
  await saveLocal(kind, n, false);
  return (n.updatedAt || '') > (sentAt || '');
}

async function mergeServer(kind, items) {
  const norm = kind === 'grievances' ? normalizeGrievance : normalizeSubmission;
  for (const s of items) {
    if (!s || s.id == null) continue;
    const sid = String(s.id);
    const local = state[kind].find(r => r.id != null && String(r.id) === sid) || (s.clientId ? state[kind].find(r => r.lid === s.clientId) : null);
    if (local && local.sync !== 'synced') {
      // A local change is waiting to be pushed; it is resolved by LWW at push time.
      if (!local.id) { local.id = sid; await dbPut(kind, local); }
      continue;
    }
    const n = norm(s, local ? local.lid : undefined);
    if (local && (local.updatedAt || '') > (n.updatedAt || '')) continue;
    if (local && (!n.photos || !n.photos.length) && local.photos && local.photos.length && !n.redacted) n.photos = local.photos;
    applyAgentRedaction(kind, n);
    await saveLocal(kind, n, false);
  }
}
async function replaceProjects(list) {
  const norm = list.filter(p => p && p.id != null).map(normalizeProject);
  await dbClear('projects');
  for (const p of norm) await dbPut('projects', p);
  state.projects = norm;
  ensureProjectSelection();
}
async function pullAll() {
  const u = me();
  await replaceProjects(pickList(await api('GET', '/projects'), ['items', 'data', 'projects']));
  const gq = isAgent() ? '?createdBy=' + encodeURIComponent(u.id) : '';
  const sq = isAgent() ? '?agentId=' + encodeURIComponent(u.id) : '';
  const g = await api('GET', '/grievances' + gq);
  await mergeServer('grievances', pickList(g, ['items', 'data', 'grievances', 'cases']));
  const s = await api('GET', '/submissions' + sq);
  await mergeServer('submissions', pickList(s, ['items', 'data', 'submissions']));
}

async function syncNow(manual) {
  if (!state.session || state.syncing) return;
  if (!navigator.onLine) {
    state.online = false; renderSyncPill();
    if (manual) toast('Offline. ' + pendingCount() + ' record(s) will sync when you reconnect.');
    return;
  }
  state.online = true;
  state.syncing = true;
  renderSyncPill();
  let pushed = 0, failed = 0, conflicts = 0, stopped = false, pullError = '';
  try {
    for (const kind of ['grievances', 'submissions']) {
      const queue = state[kind].filter(r => r.sync === 'queued' || r.sync === 'failed')
        .sort((a, b) => String(a.updatedAt).localeCompare(String(b.updatedAt)));
      for (const rec of queue) {
        try { if (await pushRecord(kind, rec)) conflicts++; pushed++; }
        catch (e) {
          if (e.network || e.status === 401) { stopped = true; break; }
          rec.sync = 'failed'; rec.syncError = e.message; await dbPut(kind, rec); failed++;
        }
      }
      if (stopped) break;
    }
    if (!stopped) {
      try { await pullAll(); state.lastSync = nowIso(); await dbPut('meta', state.lastSync, 'lastSync'); }
      catch (e) { pullError = e.network ? 'connection lost' : e.message; }
    }
  } finally {
    state.syncing = false;
  }
  if (manual) {
    if (stopped) toast('Connection dropped. Records stay queued.');
    else if (failed) toast(failed + ' record(s) failed. Open Records to retry.');
    else if (pullError) toast('Sent ' + pushed + ', but refresh failed: ' + pullError);
    else toast(pushed ? 'Synced ' + pushed + ' record(s)' : 'Up to date');
  }
  if (conflicts) toast(conflicts + ' record(s) were newer on the server; the latest version was kept.');
  refreshView(true);
}
async function retryRecord(kind, lid) {
  const rec = state[kind].find(r => r.lid === lid);
  if (!rec || rec.sync !== 'failed') return;
  rec.sync = 'queued'; rec.syncError = '';
  await dbPut(kind, rec);
  syncNow(true);
}

/* =====================================================================
   GRM DOMAIN RULES
   ===================================================================== */
function projectRules(pid) {
  const p = projectById(pid);
  return { ackDays: Number(p && p.ackDays) || GRM_CONFIG.ackDays, resolveDays: Number(p && p.resolveDays) || GRM_CONFIG.resolveDays };
}
function dueState(left) { return left < 0 ? 'overdue' : (left <= GRM_CONFIG.dueSoonDays ? 'soon' : 'pending'); }
function dueText(left) { return left < 0 ? (-left) + ' d overdue' : (left === 0 ? 'Due today' : left + ' d left'); }
function caseTimeline(c) {
  const r = projectRules(c.projectId);
  const t = todayStr();
  const ackDue = addDays(c.receivedAt, r.ackDays);
  const target = c.targetDate || addDays(c.receivedAt, r.resolveDays);
  const open = OPEN_STATUSES.includes(c.status);
  let ack;
  if (c.acknowledgedAt) {
    const late = diffDays(ackDue, c.acknowledgedAt);
    ack = { state: late > 0 ? 'late' : 'met', text: late > 0 ? 'Acknowledged ' + late + ' d late' : 'Acknowledged on time' };
  } else if (c.status === 'received') {
    const left = diffDays(t, ackDue);
    ack = { state: dueState(left), text: dueText(left) };
  } else ack = { state: 'met', text: 'Acknowledged' };
  let res;
  if (c.resolutionDate && (c.status === 'resolved' || c.status === 'closed')) {
    const late = diffDays(target, c.resolutionDate);
    res = { state: late > 0 ? 'late' : 'met', text: late > 0 ? 'Resolved ' + late + ' d late' : 'Resolved on time' };
  } else if (!open) res = { state: 'met', text: lbl(STATUSES, c.status) };
  else { const left = diffDays(t, target); res = { state: dueState(left), text: dueText(left) }; }
  return { ackDue, target, ack, res, open, overdue: open && t > target, ackOverdue: c.status === 'received' && t > ackDue, daysOpen: diffDays(c.receivedAt, c.closedAt || t) };
}
function canViewSensitive(c) {
  if (!c.sensitive) return true;
  if (c.redacted) return false;
  const u = me();
  if (u.canViewSensitive) return true;
  if (c.handlerId && String(c.handlerId) === u.id) return true;
  return isAgent() && c.createdBy && c.createdBy.id === u.id && c.sync !== 'synced';
}
/** Identity as shown in lists, feeds and the dashboard (never the detail view). */
function identityCell(c) {
  if (c.sensitive) return '<span class="restricted">' + icon('lock') + 'Restricted</span>';
  if (c.anonymous) return '<span class="muted">Anonymous</span>';
  if (c.confidential) return '<span class="muted">Confidential</span>';
  return esc((c.grievant && c.grievant.name) || '-');
}
function nextProvisionalRef(projectId) {
  const p = projectById(projectId);
  const code = (p && p.code) || 'GRM';
  let max = 0;
  for (const g of state.grievances) {
    if (String(g.projectId) !== String(projectId)) continue;
    const m = String(g.ref || '').match(/(\d+)$/);
    if (m) max = Math.max(max, Number(m[1]));
  }
  return code + '-' + String(max + 1).padStart(4, '0');
}
function allowedTransitions(c) { return TRANSITIONS[c.status] || []; }
function auditEntry(extra) { const u = me(); return Object.assign({ at: nowIso(), by: u.name, byId: u.id }, extra); }
async function transitionCase(c, to, fields, note) {
  if (!allowedTransitions(c).includes(to)) throw new Error('A case cannot move from ' + lbl(STATUSES, c.status) + ' to ' + lbl(STATUSES, to) + '.');
  Object.assign(c, fields || {});
  c.history = (c.history || []).concat([auditEntry({ from: c.status, to, note: note || '' })]);
  c.status = to;
  return queueLocal('grievances', c);
}
async function updateCase(c, fields, note) {
  Object.assign(c, fields);
  c.history = (c.history || []).concat([auditEntry({ note })]);
  return queueLocal('grievances', c);
}
async function appendNote(c, text) {
  c.notes = (c.notes || []).concat([auditEntry({ text })]);
  return queueLocal('grievances', c);
}
function scoped(list) {
  if (state.projectId) return list.filter(r => String(r.projectId) === String(state.projectId));
  const allowed = me().projects;
  return allowed.length ? list.filter(r => allowed.includes(String(r.projectId))) : list;
}
function knownPeople() {
  const map = new Map();
  const add = (id, name) => { if (id && name && !map.has(String(id))) map.set(String(id), name); };
  const u = me();
  add(u.id, u.name);
  for (const g of state.grievances) { if (g.createdBy) add(g.createdBy.id, g.createdBy.name); add(g.handlerId, g.handlerName); }
  for (const s of state.submissions) if (s.agent) add(s.agent.id, s.agent.name);
  return Array.from(map, ([id, name]) => ({ id, name })).sort((a, b) => a.name.localeCompare(b.name));
}

/* =====================================================================

function formCtx() { return state.ui.form || (state.ui.form = { gps: null, photos: [] }); }
function gpsInner(g, busy) {
  const body = busy ? '<span class="muted">Locating…</span>'
    : g ? '<b class="mono">' + g.lat.toFixed(6) + ', ' + g.lng.toFixed(6) + '</b><div class="small muted">±' + Math.round(g.acc || 0) + ' m · ' + esc(fmtDateTime(g.at)) + '</div>'
    : '<span class="muted">No GPS fix yet</span>';
  return icon('pin') + '<div class="grow">' + body + '</div><button type="button" class="btn btn-sm" data-act="gps"' + (busy ? ' disabled' : '') + '>' + (g ? 'Refresh' : 'Capture GPS') + '</button>';
}
function gpsWidget() { return '<div class="gps-box" id="gps-box">' + gpsInner(formCtx().gps, false) + '</div>'; }
function paintGps(busy) { const el = document.getElementById('gps-box'); if (el) el.innerHTML = gpsInner(formCtx().gps, busy); }
function captureGps(auto) {
  if (!('geolocation' in navigator)) { if (!auto) toast('This device has no GPS access.'); return; }
  const ctx = formCtx();
  paintGps(true);
  navigator.geolocation.getCurrentPosition(
    pos => {
      if (formCtx() !== ctx) return;
      ctx.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy, at: new Date(pos.timestamp || Date.now()).toISOString() };
      paintGps(false);
    },
    err => { if (formCtx() !== ctx) return; paintGps(false); if (!auto) toast('GPS unavailable: ' + (err.message || 'permission denied')); },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 }
  );
}
function photosWidget() {
  return '<input type="file" id="photo-input" accept="image/*" capture="environment" multiple class="hidden" data-change="photos">' +
    '<button type="button" class="btn" data-act="photo-pick">' + icon('camera') + 'Add photo</button> <span class="small muted">Up to ' + GRM_CONFIG.maxPhotos + ', compressed on the phone</span>' +
    '<div class="photos" id="photos">' + photosInner() + '</div>';
}
function photosInner() {
  return formCtx().photos.map((p, i) => '<div class="photo"><img src="' + esc(p.dataUrl) + '" alt="Attachment ' + (i + 1) + '"><button type="button" data-act="photo-del" data-i="' + i + '" aria-label="Remove photo">×</button></div>').join('');
}
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = GRM_CONFIG.photoMaxPx;
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ name: file.name || 'photo.jpg', type: 'image/jpeg', dataUrl: c.toDataURL('image/jpeg', GRM_CONFIG.photoQuality), takenAt: nowIso() });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
    img.src = url;
  });
}
ACTIONS.gps = () => captureGps(false);
ACTIONS['photo-pick'] = () => { const i = document.getElementById('photo-input'); if (i) i.click(); };
ACTIONS['photo-del'] = (el) => { formCtx().photos.splice(Number(el.dataset.i), 1); document.getElementById('photos').innerHTML = photosInner(); };
CHANGES.photos = async (el) => {
  const ctx = formCtx();
  for (const f of Array.from(el.files || [])) {
    if (ctx.photos.length >= GRM_CONFIG.maxPhotos) { toast('Photo limit reached'); break; }
    try { ctx.photos.push(await compressImage(f)); } catch (e) { toast(e.message); }
  }
  el.value = '';
  const box = document.getElementById('photos');
  if (box) box.innerHTML = photosInner();
};
function markInvalid(form, names) {
  form.querySelectorAll('.invalid').forEach(x => x.classList.remove('invalid'));
  for (const n of names) {
    const el = form.querySelector('[name="' + n + '"]');
    const target = el && (el.type === 'radio' || el.type === 'checkbox') ? el.closest('.field') : el;
    if (target) target.classList.add('invalid');
  }
  const first = form.querySelector('.invalid');
  if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

FORMS.grievance = async (form, submitter) => {
  const intent = submitter && submitter.value === 'draft' ? 'draft' : 'submit';
  const f = form.elements;
  const ctx = formCtx();
  const u = me();
  const existing = form.dataset.lid ? state.grievances.find(x => x.lid === form.dataset.lid) : null;
  if (existing && existing.sync !== 'draft') { toast('This record is already submitted.'); return; }
  const anonymous = f.anonymous.checked;
  const severityEl = form.querySelector('input[name=severity]:checked');
  const bad = [];
  if (intent === 'submit') {
    if (!f.receivedAt.value || f.receivedAt.value > todayStr()) bad.push('receivedAt');
    if (!f.projectId.value) bad.push('projectId');
    if (!f.category.value) bad.push('category');
    if (!severityEl) bad.push('severity');
    if (f.description.value.trim().length < 5) bad.push('description');
    if (!anonymous && !f.g_name.value.trim()) bad.push('g_name');
  } else if (!f.projectId.value) bad.push('projectId');
  if (bad.length) {
    markInvalid(form, bad);
    document.getElementById('form-err').innerHTML = '<div class="alert-box">Complete the highlighted fields.</div>';
    return;
  }
  const rec = existing || { lid: uid(), status: 'received', notes: [], history: [], photos: [], createdBy: { id: u.id, name: u.name }, createdAt: nowIso() };
  const projectChanged = rec.projectId && String(rec.projectId) !== String(f.projectId.value);
  rec.clientId = rec.lid;
  rec.projectId = f.projectId.value;
  rec.receivedAt = f.receivedAt.value || todayStr();
  rec.channel = f.channel.value;
  rec.anonymous = anonymous;
  rec.confidential = f.confidential.checked;
  rec.sensitive = f.sensitive.checked;
  rec.grievant = anonymous ? null : { name: f.g_name.value.trim(), phone: f.g_phone.value.trim(), address: f.g_address.value.trim() };
  rec.category = f.category.value;
  rec.subCategory = f.subCategory.value.trim();
  rec.severity = severityEl ? severityEl.value : '';
  rec.description = f.description.value.trim();
  rec.location = Object.assign({ text: f.locText.value.trim() }, ctx.gps || {});
  rec.photos = ctx.photos.slice();
  rec.targetDate = addDays(rec.receivedAt, projectRules(rec.projectId).resolveDays);
  if (!rec.ref || projectChanged) { rec.ref = nextProvisionalRef(rec.projectId); rec.refProvisional = true; }
  if (intent === 'draft') {
    rec.sync = 'draft';
    await saveLocal('grievances', rec);
    toast('Draft saved on this device');
  } else {
    rec.history = [auditEntry({ to: 'received', note: 'Logged via ' + lbl(GRM_CHANNELS, rec.channel) })];
    await queueLocal('grievances', rec);

    if (f.status === 'ack' && !tl.ackOverdue) return false;
    if (f.status && !['open', 'ack'].includes(f.status) && c.status !== f.status) return false;
    if (f.category && c.category !== f.category) return false;
    if (f.project && String(c.projectId) !== f.project) return false;
    if (f.agent && !(c.createdBy && c.createdBy.id === f.agent)) return false;
    if (f.from && c.receivedAt < f.from) return false;
    if (f.to && c.receivedAt > f.to) return false;
    if (f.overdue && !tl.overdue) return false;
    if (q) {
      const hay = [c.ref, c.subCategory, lbl(GRM_CATEGORIES, c.category), c.handlerName];
      if (!c.sensitive) {
        hay.push(c.location && c.location.text, c.description);

      }
      if (!hay.filter(Boolean).join(' ').toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const statRank = Object.fromEntries(STATUSES.map(([k], i) => [k, i]));
  const key = {
    ref: c => c.ref || '', receivedAt: c => c.receivedAt || '', category: c => lbl(GRM_CATEGORIES, c.category),
    severity: c => sevRank[c.severity] || 0, status: c => statRank[c.status] || 0,
    target: c => caseTimeline(c).target, handler: c => c.handlerName || '~', project: c => projectLabel(c.projectId)
  }[f.sort] || (c => c.receivedAt);

FORMS.transition = async (form) => {

  const to = form.dataset.to;
  if (!c) return;
  const f = form.elements;

  const bad = [];
  const fields = {};
  const today = todayStr();
  if (to === 'acknowledged') {
    if (!v('ackDate') || v('ackDate') < c.receivedAt || v('ackDate') > today) bad.push('ackDate');
    if (!v('targetDate') || v('targetDate') < c.receivedAt) bad.push('targetDate');
    Object.assign(fields, { acknowledgedAt: v('ackDate'), targetDate: v('targetDate') });
  } else if (to === 'under_investigation') {
    const h = resolveHandler(v('handler') || c.handlerName);
    if (!h.handlerName) bad.push('handler');
    Object.assign(fields, h);
  } else if (to === 'resolved') {
    if (v('resolution').length < 3) bad.push('resolution');
    if (!v('resolutionDate') || v('resolutionDate') < c.receivedAt || v('resolutionDate') > today) bad.push('resolutionDate');
    Object.assign(fields, { resolution: v('resolution'), resolutionDate: v('resolutionDate') });
  } else if (to === 'closed') {
    if (!v('feedback')) bad.push('feedback');
    if (!v('closureReason')) bad.push('closureReason');
    if (!v('closedAt') || v('closedAt') < (c.resolutionDate || c.receivedAt) || v('closedAt') > today) bad.push('closedAt');
    Object.assign(fields, { feedback: v('feedback'), closureReason: v('closureReason'), closedAt: v('closedAt') });
  } else if (to === 'appealed') {
    if (v('appealNotes').length < 3) bad.push('appealNotes');
    Object.assign(fields, {
      appeal: true, appealNotes: v('appealNotes'), appealedAt: today, feedback: 'not_satisfied',
      previousResolutions: (c.previousResolutions || []).concat(c.resolution ? [{ resolution: c.resolution, resolutionDate: c.resolutionDate }] : []),
      resolution: '', resolutionDate: ''
    });
  }
  if (bad.length) { markInvalid(form, bad); document.getElementById('tr-err').innerHTML = '<div class="alert-box">Complete the highlighted fields.</div>'; return; }
  try { await transitionCase(c, to, fields, v('note')); }
  catch (e) { document.getElementById('tr-err').innerHTML = '<div class="alert-box">' + esc(e.message) + '</div>'; return; }
  closeModal();
  toast(c.ref + ' · ' + lbl(STATUSES, to));
  refreshView();
};

FORMS.project = async (form) => {
  const f = form.elements;
  const name = f.name.value.trim();
  const code = f.code.value.trim().toUpperCase();
  const bad = [];
  if (!name) bad.push('name');
  if (!/^[A-Z0-9]{2,6}$/.test(code) || state.projects.some(p => (p.code || '').toUpperCase() === code)) bad.push('code');
  const ackDays = Number(f.ackDays.value), resolveDays = Number(f.resolveDays.value);
  if (!(ackDays >= 1)) bad.push('ackDays');
  if (!(resolveDays >= ackDays)) bad.push('resolveDays');
  const err = document.getElementById('proj-err');
  if (bad.length) { markInvalid(form, bad); err.innerHTML = '<div class="alert-box">Check the highlighted fields. Codes are 2 to 6 letters or digits and must be unique; resolution days cannot be shorter than acknowledgement days.</div>'; return; }
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true;
  try {
    const res = await api('POST', '/projects', { name, code, ackDays, resolveDays, description: f.description.value.trim() });
    const p = normalizeProject(Object.assign({ name, code, ackDays, resolveDays }, (res && (res.item || res.project || res)) || {}));
    await dbPut('projects', p);
    state.projects.push(p);
    state.projectId = p.id;
    await dbPut('meta', p.id, 'projectId');
    toast('Project ' + p.name + ' created');
    refreshView();
  } catch (e) {
    btn.disabled = false;
    err.innerHTML = '<div class="alert-box">' + esc(e.network ? 'No connection. Try again when online.' : e.message) + '</div>';
  }
};

/* =====================================================================
   SUPERVISOR / HQ: REPORT BUILDER
   Reports never contain grievant identities. Sensitive cases are counted,
   but their category, handler and any detail are withheld.
   ===================================================================== */
function quarterStart() { const d = new Date(); return ymd(new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1)); }
function reportCfg() {
  return state.ui.report || (state.ui.report = { type: 'both', project: state.projectId || '', from: quarterStart(), to: todayStr(), built: false });
}
function pct(n, d) { return d ? Math.round(n / d * 100) + '%' : '-'; }
function rTable(head, rows, numericFrom) {
  const nf = numericFrom == null ? 1 : numericFrom;
  return '<table><thead><tr>' + head.map((h, i) => '<th' + (i >= nf ? ' class="n"' : '') + '>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(r => '<tr>' + r.map((c, i) => '<td' + (i >= nf ? ' class="n"' : '') + '>' + esc(c) + '</td>').join('') + '</tr>').join('') : '<tr><td colspan="' + head.length + '">No records in this period.</td></tr>') + '</tbody></table>';
}
function reportScope(list, cfg) {
  const allowed = me().projects;
  return list.filter(r => r.sync !== 'draft' && (cfg.project ? String(r.projectId) === String(cfg.project) : (!allowed.length || allowed.includes(String(r.projectId)))));
}
function reportHeader(title, cfg) {
  const p = projectById(cfg.project);
  return '<h1>' + esc(title) + '</h1><div class="rmeta">' + esc(p ? p.name + (p.code ? ' (' + p.code + ')' : '') : 'All projects') + ' · Period ' + esc(fmtDate(cfg.from)) + ' to ' + esc(fmtDate(cfg.to)) +
    '<br>Generated ' + esc(fmtDateTime(nowIso())) + ' by ' + esc(me().name) + ' · Data as of ' + esc(state.lastSync ? fmtDateTime(state.lastSync) : 'last local save') + '</div>';
}
function grmReportHtml(cfg) {
  const all = reportScope(state.grievances, cfg);
  const cases = all.filter(c => c.receivedAt >= cfg.from && c.receivedAt <= cfg.to);
  const tls = new Map(cases.map(c => [c.lid, caseTimeline(c)]));
  const total = cases.length;
  const openN = cases.filter(c => OPEN_STATUSES.includes(c.status)).length;
  const closed = cases.filter(c => c.status === 'closed');
  const resolvedOrClosed = cases.filter(c => c.status === 'resolved' || c.status === 'closed').length;
  const overdue = cases.filter(c => tls.get(c.lid).overdue);
  const closeDays = closed.filter(c => c.closedAt).map(c => diffDays(c.receivedAt, c.closedAt));
  const avgClose = closeDays.length ? (closeDays.reduce((a, b) => a + b, 0) / closeDays.length).toFixed(1) : '-';
  const acked = cases.filter(c => c.acknowledgedAt);
  const ackOnTime = acked.filter(c => tls.get(c.lid).ack.state === 'met').length;
  const sensitiveN = cases.filter(c => c.sensitive).length;
  const byStatus = countBy(cases, c => c.status);
  const byCat = countBy(cases.filter(c => !c.sensitive), c => c.category);
  const bySev = countBy(cases, c => c.severity);
  const projIds = Array.from(new Set(cases.map(c => String(c.projectId))));
  const projRows = projIds.map(id => {
    const pc = cases.filter(c => String(c.projectId) === id);
    return [projectById(id) ? projectById(id).name : id, pc.length, pc.filter(c => OPEN_STATUSES.includes(c.status)).length, pc.filter(c => c.status === 'closed').length, pc.filter(c => tls.get(c.lid).overdue).length];
  });
  const overdueRows = overdue.sort((a, b) => tls.get(a.lid).target.localeCompare(tls.get(b.lid).target)).map(c => {
    const tl = tls.get(c.lid);
    return c.sensitive
      ? [c.ref, projectLabel(c.projectId), 'Sensitive case (restricted)', fmtDate(c.receivedAt), fmtDate(tl.target), -diffDays(todayStr(), tl.target), '-', lbl(STATUSES, c.status)]
      : [c.ref, projectLabel(c.projectId), lbl(GRM_CATEGORIES, c.category), fmtDate(c.receivedAt), fmtDate(tl.target), -diffDays(todayStr(), tl.target), c.handlerName || 'Unassigned', lbl(STATUSES, c.status)];
  });
  const catRows = GRM_CATEGORIES.map(([k, t]) => [t, byCat[k] || 0, pct(byCat[k] || 0, total)]);
  if (sensitiveN) catRows.push(['Sensitive cases (category withheld)', sensitiveN, pct(sensitiveN, total)]);
  return '<div class="report">' + reportHeader('GRM status report', cfg) +
    '<div class="summary"><div><span>Grievances received</span><b>' + total + '</b></div><div><span>Open</span><b>' + openN + '</b></div><div><span>Closed</span><b>' + closed.length + '</b></div><div><span>Overdue (open, past target)</span><b>' + overdue.length + '</b></div>' +
    '<div><span>Resolution rate</span><b>' + pct(resolvedOrClosed, total) + '</b></div><div><span>Average days to close</span><b>' + avgClose + '</b></div><div><span>Acknowledged within standard</span><b>' + pct(ackOnTime, acked.length) + '</b></div><div><span>Appeals lodged</span><b>' + cases.filter(c => c.appeal).length + '</b></div></div>' +
    '<h2>Cases by status</h2>' + rTable(['Status', 'Cases', 'Share'], STATUSES.map(([k, t]) => [t, byStatus[k] || 0, pct(byStatus[k] || 0, total)])) +
    '<h2>Cases by category</h2>' + rTable(['Category', 'Cases', 'Share'], catRows) +
    '<h2>Cases by severity</h2>' + rTable(['Severity', 'Cases', 'Share'], SEVERITIES.map(([k, t]) => [t, bySev[k] || 0, pct(bySev[k] || 0, total)])) +
    '<h2>Cases by project</h2>' + rTable(['Project', 'Cases', 'Open', 'Closed', 'Overdue'], projRows) +
    '<h2>Overdue cases</h2>' + rTable(['Ref', 'Project', 'Category', 'Received', 'Target', 'Days overdue', 'Handler', 'Status'], overdueRows, 5) +
    '<p class="note">Resolution rate = cases resolved or closed ÷ cases received in the period. Average days to close is measured from receipt to closure. Grievant identities are never included in this report; sensitive cases are counted but their details are withheld.</p></div>';
}
function fieldReportHtml(cfg) {
  const subs = reportScope(state.submissions, cfg).filter(s => { const d = String(s.capturedAt).slice(0, 10); return d >= cfg.from && d <= cfg.to; });
  const total = subs.length;
  const projIds = Array.from(new Set(subs.map(s => String(s.projectId))));
  const agentMap = new Map();
  for (const s of subs) {
    const id = (s.agent && s.agent.id) || '?';
    const a = agentMap.get(id) || { name: (s.agent && s.agent.name) || 'Unknown', n: 0, last: '' , gps: 0 };
    a.n++; if (String(s.capturedAt) > a.last) a.last = String(s.capturedAt); if (s.gps) a.gps++;
    agentMap.set(id, a);
  }
  const sumFields = SURVEY_FORM.fields.filter(f => f.sum);
  const sums = sumFields.map(f => {
    const vals = subs.map(s => Number((s.data || {})[f.key])).filter(v => !isNaN(v));
    const t = vals.reduce((a, b) => a + b, 0);
    return [f.label, Math.round(t * 100) / 100, vals.length ? (t / vals.length).toFixed(1) : '-', vals.length];
  });
  const tallies = SURVEY_FORM.fields.filter(f => f.tally).map(f => {
    const counts = {};
    for (const s of subs) {
      const v = (s.data || {})[f.key];
      const vals = Array.isArray(v) ? v : (v == null || v === '' ? [] : [v]);
      for (const x of vals) counts[x] = (counts[x] || 0) + 1;
    }
    const opts = f.options || (f.type === 'yesno' ? ['Yes', 'No'] : Object.keys(counts).sort());
    const rows = opts.map(o => [o, counts[o] || 0, pct(counts[o] || 0, total)]);
    return '<h2>' + esc(f.label) + (f.type === 'multi' ? ' <span style="font-weight:400;font-size:.8rem">(multiple answers)</span>' : '') + '</h2>' + rTable(['Answer', 'Households', 'Share'], rows);
  }).join('');
  return '<div class="report">' + reportHeader('Field-data summary', cfg) +
    '<div class="summary"><div><span>Submissions</span><b>' + total + '</b></div><div><span>Field agents</span><b>' + agentMap.size + '</b></div><div><span>Projects</span><b>' + projIds.length + '</b></div><div><span>With GPS</span><b>' + pct(subs.filter(s => s.gps).length, total) + '</b></div></div>' +
    '<h2>Submissions by project</h2>' + rTable(['Project', 'Submissions', 'Share'], projIds.map(id => { const n = subs.filter(s => String(s.projectId) === id).length; return [projectById(id) ? projectById(id).name : id, n, pct(n, total)]; })) +
    '<h2>Submissions by agent</h2>' + rTable(['Agent', 'Submissions', 'With GPS', 'Last submission'], Array.from(agentMap.values()).sort((a, b) => b.n - a.n).map(a => [a.name, a.n, a.gps, fmtDateTime(a.last)])) +
    (sums.length ? '<h2>Household totals</h2>' + rTable(['Measure', 'Total', 'Average per household', 'Households reporting'], sums) : '') +
    tallies +
    '<p class="note">Survey: ' + esc(SURVEY_FORM.title) + ' (' + esc(SURVEY_FORM.id) + '). Household names and phone numbers are excluded from this summary.</p></div>';
}
