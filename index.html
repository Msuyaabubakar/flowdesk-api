function parseRoute() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean).map(decodeURIComponent);
  return { name: parts.slice(0, 2).join('/'), params: parts.slice(2) };
}
function defaultRoute() { return isAgent() ? '#/agent/home' : '#/hq/dashboard'; }
function startApp() {
  const r = parseRoute();
  const prefix = isAgent() ? 'agent/' : 'hq/';
  if (!r.name.startsWith(prefix) || !VIEWS[r.name]) location.hash = defaultRoute();
  else render();
  startTimers();
}
function render() {
  if (!state.session) { renderLogin(); return; }
  const r = parseRoute();
  const prefix = isAgent() ? 'agent/' : 'hq/';
  if (!r.name.startsWith(prefix) || !VIEWS[r.name]) { location.hash = defaultRoute(); return; }
  const view = VIEWS[r.name];
  clearInterval(timers.feed); timers.feed = null;
  if (r.name !== 'hq/feed') state.ui.feedPrevSeen = undefined;
  const body = view.render(r.params);
  document.getElementById('app').innerHTML = isAgent() ? agentShell(r.name, body) : hqShell(r.name, body);
  if (view.mount) view.mount(r.params);
  window.scrollTo(0, 0);
}
/** Re-render the current view in place without scrolling (used after background changes). */
function refreshView(background) {
  if (!state.session) return;
  const active = document.activeElement;
  // Background refreshes (sync, feed polling) never wipe a form the user is typing in.
  if (background && active && active.closest && active.closest('form[data-form]')) { renderSyncPill(); return; }
  const y = window.scrollY;
  const r = parseRoute();
  const view = VIEWS[r.name];
  if (!view || view.static) { renderSyncPill(); return; }
  const body = view.render(r.params);
  document.getElementById('app').innerHTML = isAgent() ? agentShell(r.name, body) : hqShell(r.name, body);
  if (view.mount) view.mount(r.params);
  window.scrollTo(0, y);
}

function syncPillHtml() {
  const pend = pendingCount();
  const failed = state.grievances.concat(state.submissions).filter(r => r.sync === 'failed').length;
  let cls = '', text;
  if (!state.online) { cls = 'off'; text = pend ? 'Offline · ' + pend + ' queued' : 'Offline'; }
  else if (state.syncing) { cls = 'pend busy'; text = 'Syncing…'; }
  else if (failed) { cls = 'fail'; text = failed + ' failed · retry'; }
  else if (pend) { cls = 'pend'; text = pend + ' queued · sync'; }
  else { text = 'All synced'; }
  return '<button class="sync-pill ' + cls + '" data-act="sync-now" id="sync-pill" title="' + esc(state.lastSync ? 'Last sync ' + fmtDateTime(state.lastSync) : 'Not synced yet') + '"><span class="dot"></span>' + esc(text) + '</button>';
}
function renderSyncPill() {
  const el = document.getElementById('sync-pill');
  if (el) el.outerHTML = syncPillHtml();
  const ob = document.getElementById('offline-bar');
  if (ob) ob.classList.toggle('hidden', state.online);
}
function accessibleProjects() {
  const u = me();
  if (!u) return [];
  if (!u.projects.length) return state.projects;
  return state.projects.filter(p => u.projects.includes(String(p.id)));
}
function projectById(id) { return state.projects.find(p => String(p.id) === String(id)) || null; }
function projectSelectHtml(allowAll) {
  const list = accessibleProjects();
  if (!list.length) return '<div class="proj-name">No project yet</div>';
  let opts = allowAll ? '<option value="">All projects</option>' : '';
  for (const p of list) opts += '<option value="' + esc(p.id) + '"' + (String(state.projectId) === String(p.id) ? ' selected' : '') + '>' + esc((p.code ? p.code + ' · ' : '') + p.name) + '</option>';
  return '<select class="inp" data-change="project" aria-label="Current project">' + opts + '</select>';
}
function agentShell(name, body) {
  const nav = [['agent/home', 'home', 'Home'], ['agent/grievance', 'alert', 'Grievance'], ['agent/survey', 'clipboard', 'Survey'], ['agent/records', 'list', 'Records']];
  return '<div id="offline-bar" class="offline-bar' + (state.online ? ' hidden' : '') + '">Offline. Everything you save is stored on this phone and syncs when signal returns.</div>' +
    '<header class="topbar"><div class="proj">' + projectSelectHtml(false) + '</div>' + syncPillHtml() + '</header>' +
    '<main class="agent-main">' + body + '</main>' +
    '<nav class="bottom-nav">' + nav.map(n => '<a href="#/' + n[0] + '" class="' + (name.startsWith(n[0]) ? 'on' : '') + '">' + icon(n[1]) + n[2] + '</a>').join('') + '</nav>';
}
function hqShell(name, body) {
  const nav = [['hq/dashboard', 'grid', 'Dashboard'], ['hq/cases', 'alert', 'Cases'], ['hq/feed', 'inbox', 'Field data'], ['hq/reports', 'report', 'Reports'], ['hq/projects', 'folder', 'Projects'], ['hq/team', 'users', 'Team']];
  const isOn = n => name === n || (n === 'hq/cases' && (name === 'hq/case' || name === 'hq/new-case'));
  const u = me();
  return '<div class="hq"><aside class="side"><div class="brand"><div class="brand-mark">' + icon('logo') + '</div><div><b>FlowDesk</b><small>GRM + field data</small></div></div>' +
    nav.map(n => '<a href="#/' + n[0] + '" class="' + (isOn(n[0]) ? 'on' : '') + '">' + icon(n[1]) + n[2] + '</a>').join('') +
    '<div class="who"><b>' + esc(u.name) + '</b>' + esc(u.email) + '<br><button data-act="logout">Sign out</button></div></aside>' +
    '<div class="hq-body"><div id="offline-bar" class="offline-bar' + (state.online ? ' hidden' : '') + '">Offline. Changes are saved on this device and sync when the connection returns.</div>' +
    '<header class="topbar"><div class="proj row">' + projectSelectHtml(true) + '</div>' + syncPillHtml() + '</header>' +
    '<nav class="mob-nav">' + nav.map(n => '<a href="#/' + n[0] + '" class="' + (isOn(n[0]) ? 'on' : '') + '">' + n[2] + '</a>').join('') + '<a href="#" data-act="logout">Sign out</a></nav>' +
    '<main class="hq-main">' + body + '</main></div></div>';
}

/* =====================================================================
   MODAL
   ===================================================================== */
function openModal(html) {
  document.getElementById('modal-root').innerHTML = '<div class="modal-bg" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
  const first = document.querySelector('#modal-root input, #modal-root select, #modal-root textarea');
  if (first) first.focus();
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

/* =====================================================================
   EVENT DELEGATION
   ===================================================================== */
Object.assign(ACTIONS, {
  'modal-close': () => closeModal(),
  'modal-bg': (el, ev) => { if (ev.target === el) closeModal(); },
  'logout': () => logout(false),
  'logout-force': () => { expiredShown = false; logout(true); },
  'sync-now': () => { closeModal(); syncNow(true); }
});
Object.assign(FORMS, {
  login: async (form) => {
    const btn = form.querySelector('button[type=submit]');
    const errBox = document.getElementById('login-err');
    const email = form.email.value.trim();
    const password = form.password.value;
    if (!email || !password) { errBox.innerHTML = '<div class="alert-box">Enter your email and password.</div>'; return; }
    btn.disabled = true; btn.textContent = 'Signing in…';
    try { await login(email, password); }
    catch (e) {
      errBox.innerHTML = '<div class="alert-box">' + esc(e.network ? 'No connection. Sign in requires network the first time.' : e.message) + '</div>';
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  }
});
CHANGES.project = async (el) => {
  state.projectId = el.value;
  await dbPut('meta', state.projectId, 'projectId');
  refreshView();
};
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  fn(el, ev);
});
document.addEventListener('submit', (ev) => {
  const form = ev.target.closest('form[data-form]');
  if (!form) return;
  ev.preventDefault();
  const fn = FORMS[form.dataset.form];
  if (fn) fn(form, ev.submitter || null);
});
document.addEventListener('change', (ev) => {
  const el = ev.target.closest('[data-change]');
  if (!el) return;
  const fn = CHANGES[el.dataset.change];
  if (fn) fn(el, ev);
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && document.querySelector('#modal-root .modal')) closeModal(); });
window.addEventListener('hashchange', () => { closeModal(); render(); });
window.addEventListener('online', () => { state.online = true; renderSyncPill(); syncNow(false); });
window.addEventListener('offline', () => { state.online = false; renderSyncPill(); });

/* =====================================================================
   BOOT
   ===================================================================== */
function startTimers() {
  stopTimers();
  if (typeof syncTick === 'function') timers.sync = setInterval(syncTick, GRM_CONFIG.autoSyncSeconds * 1000);
}
function stopTimers() { clearInterval(timers.sync); clearInterval(timers.feed); timers.sync = null; timers.feed = null; }

async function loadLocal() {
  const [g, s, p, pid, last, inv, seen] = await Promise.all([
    dbGetAll('grievances'), dbGetAll('submissions'), dbGetAll('projects'),
    dbGet('meta', 'projectId'), dbGet('meta', 'lastSync'), dbGet('meta', 'invites'), dbGet('meta', 'feedSeenAt')
  ]);
  state.grievances = g || [];
  state.submissions = s || [];
  state.projects = p || [];
  state.lastSync = last || null;
  state.invites = inv || [];
  state.feedSeenAt = seen || null;
  state.projectId = pid != null ? pid : '';
  ensureProjectSelection();
}
function ensureProjectSelection() {
  const list = accessibleProjects();
  const valid = list.some(p => String(p.id) === String(state.projectId));
  if (isAgent()) { if (!valid) state.projectId = list.length ? String(list[0].id) : ''; }
  else if (state.projectId && !valid) state.projectId = '';
}
async function boot() {
  try { db = await openDB(); }
  catch (_) { document.getElementById('app').innerHTML = '<div class="splash">This browser blocked local storage, which FlowDesk needs to work offline. Leave private browsing and reload.</div>'; return; }
  const session = await dbGet('meta', 'session');
  if (session && session.token && session.user) {
    state.session = session;
    await loadLocal();
    startApp();
    syncNow(false);
  } else {
    renderLogin();
  }
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
boot();
</script>
</body>
